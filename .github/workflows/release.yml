name: Publish to Github and Google Play

on:
  push:
    branches: master
    tags:
      - '*.*.*'

jobs:
  publish-github-release:
    name: Publish Github release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Decrypt and validate decrypted data
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./.github/workflows/decrypt-and-validate-data.sh

      - name: Build Github Release apk's
        run: |
          ./gradlew app:assembleFdroidRelease

      - name: Build Github test apk's
        run: |
          ./gradlew app:assembleAutomationDebug

      - name: Build Google Play bundle
        run: |
          ./gradlew app:bundleGplayRelease

      - name: Rename files
        run: |
          cp ./app/build/outputs/apk/fdroid/release/app-fdroid-release.apk ./keepassvault.apk
          cp ./app/build/outputs/apk/automation/debug/app-automation-debug.apk ./test-build.apk

      - name: Publish Github Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: |
            ./keepassvault.apk
            ./test-build.apk

  upload-to-google-play:
    name: Upload App Bundle to Google Play
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Decrypt and validate decrypted data
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: ./.github/workflows/decrypt-and-validate-data.sh

      - name: Upload to Google Play
        run: |
          ./gradlew publishGplayReleaseBundle
